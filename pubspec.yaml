name: ailaga
description: "AILaga — AI-Powered Family Caregiving Companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  pdf: ^3.11.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1
  printing: ^5.13.5
  google_fonts: ^8.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  # --- Auth & Cloud Sync (Developer D) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.7.0
  # Non-sensitive app preferences (sync toggle, UI state).
  # Health data and auth credentials are NEVER stored here — use
  # flutter_secure_storage for anything sensitive.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
